name: score
on:
  push: {branches: [main]}
  schedule: [{cron: "5 0 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python score.py
        env: {AOAI_SALT: "${{ secrets.AOAI_SALT }}", CHALLENGES_JSON: "${{ secrets.CHALLENGES_JSON }}"}
      - run: |
          git config user.name "scorer"; git config user.email "scorer@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Update leaderboard" && git push)
